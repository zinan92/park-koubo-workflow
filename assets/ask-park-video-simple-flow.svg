<svg viewBox="0 0 1000 900" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Ask Park Video 简洁流程图</title>
  <desc id="desc">输入经过五个制作阶段和三个人工审批门，最终生成成片。</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 Z" fill="#64748b" />
    </marker>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Noto Sans SC", sans-serif; }
      .title { fill: #f8fafc; font-size: 30px; font-weight: 700; }
      .subtitle { fill: #94a3b8; font-size: 15px; }
      .stage-label { fill: #22d3ee; font-size: 13px; font-weight: 700; letter-spacing: 1px; }
      .stage-title { fill: #f8fafc; font-size: 19px; font-weight: 650; }
      .stage-note { fill: #94a3b8; font-size: 14px; }
      .gate { fill: #fbbf24; font-size: 13px; font-weight: 650; }
      .flow { fill: none; stroke: #64748b; stroke-width: 2; marker-end: url(#arrow); }
      .gate-line { stroke: #fbbf24; stroke-width: 1.5; stroke-dasharray: 5 5; }
    </style>
  </defs>

  <rect width="1000" height="900" fill="#0f172a" />

  <text x="500" y="52" class="title" text-anchor="middle">Ask Park Video</text>
  <text x="500" y="80" class="subtitle" text-anchor="middle">14 Steps · 5 Stages · 3 Human Gates</text>

  <rect x="300" y="110" width="400" height="52" rx="26" fill="#172033" stroke="#60a5fa" stroke-width="1.5" />
  <text x="500" y="142" class="stage-title" text-anchor="middle">剪映粗剪 + SRT + 素材</text>

  <path d="M500 162 V198" class="flow" />

  <rect x="220" y="205" width="560" height="82" rx="12" fill="#111c2f" stroke="#22d3ee" stroke-width="1.5" />
  <text x="250" y="237" class="stage-label">STAGE A</text>
  <text x="355" y="237" class="stage-title">Preparation</text>
  <text x="355" y="263" class="stage-note">Steps 1–4 · 素材、媒体规格与字幕时间就绪</text>

  <path d="M500 287 V323" class="flow" />

  <rect x="220" y="330" width="560" height="82" rx="12" fill="#111c2f" stroke="#34d399" stroke-width="1.5" />
  <text x="250" y="362" class="stage-label" fill="#34d399">STAGE B</text>
  <text x="355" y="362" class="stage-title">Hook &amp; Product A</text>
  <text x="355" y="388" class="stage-note">Steps 5–9 · 选择 Hook，生成独立 Hook 成片</text>
  <line x1="780" y1="371" x2="812" y2="371" class="gate-line" />
  <rect x="812" y="351" width="164" height="40" rx="20" fill="#2a2416" stroke="#fbbf24" />
  <text x="894" y="376" class="gate" text-anchor="middle">H1 · Hook 批准</text>

  <path d="M500 412 V448" class="flow" />

  <rect x="220" y="455" width="560" height="82" rx="12" fill="#111c2f" stroke="#fbbf24" stroke-width="1.5" />
  <text x="250" y="487" class="stage-label" fill="#fbbf24">STAGE C</text>
  <text x="355" y="487" class="stage-title">Body &amp; Visual Direction</text>
  <text x="355" y="513" class="stage-note">Steps 10–11 · Picture Lock → ShotCraft Spec → 渲染</text>
  <line x1="780" y1="496" x2="812" y2="496" class="gate-line" />
  <rect x="812" y="476" width="164" height="40" rx="20" fill="#2a2416" stroke="#fbbf24" />
  <text x="894" y="501" class="gate" text-anchor="middle">H2 · Spec 批准</text>

  <path d="M500 537 V573" class="flow" />

  <rect x="220" y="580" width="560" height="82" rx="12" fill="#111c2f" stroke="#34d399" stroke-width="1.5" />
  <text x="250" y="612" class="stage-label" fill="#34d399">STAGE D</text>
  <text x="355" y="612" class="stage-title">Sound &amp; Product B</text>
  <text x="355" y="638" class="stage-note">Steps 12–13 · 声音、最高层字幕与 QA B</text>

  <path d="M500 662 V698" class="flow" />

  <rect x="220" y="705" width="560" height="82" rx="12" fill="#111c2f" stroke="#60a5fa" stroke-width="1.5" />
  <text x="250" y="737" class="stage-label" fill="#60a5fa">STAGE E</text>
  <text x="355" y="737" class="stage-title">Final Delivery</text>
  <text x="355" y="763" class="stage-note">Step 14 · Concatenate → QA Final → 交付</text>
  <line x1="780" y1="746" x2="812" y2="746" class="gate-line" />
  <rect x="812" y="726" width="164" height="40" rx="20" fill="#2a2416" stroke="#fbbf24" />
  <text x="894" y="751" class="gate" text-anchor="middle">H3 · Final 批准</text>

  <path d="M500 787 V820" class="flow" />
  <rect x="390" y="827" width="220" height="48" rx="24" fill="#172033" stroke="#60a5fa" stroke-width="1.5" />
  <text x="500" y="857" class="stage-title" text-anchor="middle">Final Video</text>
</svg>
